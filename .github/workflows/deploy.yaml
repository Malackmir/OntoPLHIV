
name: CI-CD OntoPLHIV RDF OWL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontoplhiv-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1 : VALIDATION DES ONTOLOGIES
  # ==========================================
  validate:
    name: Valider les ontologies RDF OWL
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Verifier la structure du projet
        run: |
          set -eu

          echo "=== Racine du depot ==="
          pwd
          ls -la

          echo "=== Verification du script de validation ==="
          if [ ! -f test/validate_plhiv.py ]; then
            echo "ERREUR : test/validate_plhiv.py est introuvable."
            exit 1
          fi

          echo "=== Verification du dossier PLHIV ==="
          if [ ! -d PLHIV ]; then
            echo "ERREUR : le dossier PLHIV/ est absent."
            exit 1
          fi

          echo "=== Fichiers du dossier PLHIV ==="
          find PLHIV -type f -print

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: |
          set -eu
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install rdflib
          fi

      - name: Executer test/validate_plhiv.py
        run: |
          set -eu
          echo "=== Validation des ontologies RDF/OWL ==="
          python test/validate_plhiv.py
          echo "Validation terminee avec succes."

  # ==========================================
  # JOB 2 : DEPLOIEMENT SUR LE VPS
  # ==========================================
  deploy:
    name: Deployer sur le VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      # ------------------------------------------
      # CONFIGURATION DE LA CLE SSH
      # ------------------------------------------
      - name: Configurer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERREUR : le secret VPS_SSH_KEY est absent."
            exit 1
          fi

          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "ERREUR : le secret VPS_KNOWN_HOSTS est absent."
            exit 1
          fi

          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          echo "Configuration SSH terminee."

      # ------------------------------------------
      # VERIFICATION DE LA CONNEXION
      # ------------------------------------------
      - name: Verifier la connexion SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "ERREUR : VPS_HOST ou VPS_USER est absent."
            exit 1
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "Connexion SSH reussie"'

      # ------------------------------------------
      # VERIFICATION DU REPERTOIRE DISTANT
      # ------------------------------------------
      - name: Verifier les permissions du repertoire distant
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            '
              DEST="/var/www/ontologies/OntoPLHIV"

              if [ ! -d "$DEST" ]; then
                echo "ERREUR : le repertoire distant nexiste pas."
                echo "Creez-le avec un compte administrateur."
                exit 1
              fi

              if [ ! -w "$DEST" ]; then
                echo "ERREUR : absence de droits decriture dans $DEST"
                exit 1
              fi

              echo "Repertoire distant accessible en ecriture."
            '

      # ------------------------------------------
      # COPIE DES ONTOLOGIES VERS LE VPS
      # ------------------------------------------
      - name: Deployer les ontologies PLHIV
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== Fichiers locaux ==="
          find PLHIV -type f -print

          echo "=== Deploiement des ontologies ==="

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            PLHIV/ \
            "$VPS_USER@$VPS_HOST:/var/www/ontologies/OntoPLHIV/"

          echo "Copie terminee."

      # ------------------------------------------
      # VERIFICATION FINALE SUR LE VPS
      # ------------------------------------------
      - name: Verifier les fichiers deployes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== Fichiers presents sur le VPS ==="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            '
              DEST="/var/www/ontologies/OntoPLHIV"

              find "$DEST" -type f -print

              if ! find "$DEST" -type f \
                \( -iname "*.ttl" \
                -o -iname "*.owl" \
                -o -iname "*.rdf" \
                -o -iname "*.jsonld" \) \
                -print -quit | grep -q .; then
                echo "ERREUR : aucun fichier RDF/OWL deploye."
                exit 1
              fi

              echo "Verification finale reussie."
            '