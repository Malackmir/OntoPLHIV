
name: CI-CD OntoPLHIV RDF OWL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontoplhiv-production
  cancel-in-progress: false

jobs:
  validate:
    name: Valider les ontologies RDF OWL
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Verifier la structure du projet
        run: |
          echo "=== Racine du depot ==="
          pwd
          ls -la

          echo "=== Verification du dossier ontologies ==="
          if [ ! -d ontologies ]; then
            echo "ERREUR : le dossier ontologies/ est absent."
            echo "Verifiez la structure du depot OntoPLHIV."
            exit 1
          fi

          find ontologies -type f -print

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install rdflib
          fi

      - name: Valider les ontologies
        run: |
          if [ ! -f tests/validate_plhiv.py ]; then
            echo "ERREUR : tests/validate_plhiv.py est introuvable."
            exit 1
          fi

          python tests/validate_plhiv.py

  deploy:
    name: Deployer sur le VPS Ubuntu
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configurer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERREUR : secret VPS_SSH_KEY absent."
            exit 1
          fi

          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "ERREUR : secret VPS_KNOWN_HOSTS absent."
            exit 1
          fi

          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          echo "Configuration SSH terminee."

      - name: Verifier la connexion et les permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "ERREUR : VPS_HOST ou VPS_USER absent."
            exit 1
          fi

          echo "=== Test SSH ==="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "Connexion SSH OK"'

          echo "=== Verification du repertoire distant ==="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -d /var/www/ontologies &&
             test -w /var/www/ontologies &&
             echo "Repertoire distant accessible en ecriture"'

      - name: Deployer les ontologies
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== Verification du dossier local ==="

          if [ ! -d ontologies ]; then
            echo "ERREUR : le dossier ontologies/ est absent du depot."
            exit 1
          fi

          find ontologies -type f -print

          echo "=== Synchronisation vers le VPS ==="

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ontologies/ \
            "$VPS_USER@$VPS_HOST:/var/www/ontologies/"

          echo "Deploiement des ontologies termine."

      - name: Verifier les fichiers deployes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== Fichiers presents sur le VPS ==="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'find /var/www/ontologies -type f -print'

          echo "Deploiement verifie."