
name: CI-CD Ontologies RDF OWL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ontologies-production
  cancel-in-progress: false

jobs:
  validate:
    name: Valider les ontologies
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Valider RDF et Turtle
        run: python tests/validate_plhiv.py

  deploy:
    name: Deployer sur le VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configurer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deployer les ontologies
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== 1. Verification du dossier local ==="
          if [ ! -d ontologies ]; then
            echo "ERREUR : le dossier ontologies/ est absent du dépôt."
            exit 1
          fi
          find ontologies -maxdepth 2 -type f -print

          echo "=== 2. Verification de la connexion SSH ==="
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -d /var/www/ontologies &&
             test -w /var/www/ontologies'
             
          echo "=== 2. Verification de la connexion SSH ==="
          rsync -az --delete \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ontologies/ \
            "$VPS_USER@$VPS_HOST:/var/www/ontologies/"

      - name: Verifier le deploiement
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'find /var/www/ontologies -type f -print'