
name: CI-CD OntoPLHIV RDF OWL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontoplhiv-production
  cancel-in-progress: false

jobs:
  validate:
    name: Valider les ontologies
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Verifier la structure du projet
        run: |
          echo "=== Racine du depot ==="
          pwd
          ls -la

          echo "=== Verification du dossier PLHIV ==="
          if [ ! -d PLHIV ]; then
            echo "ERREUR : le dossier PLHIV/ est absent du depot."
            exit 1
          fi

          find PLHIV -type f -print

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install rdflib
          fi

      - name: Valider les ontologies RDF OWL
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph

          root = Path("PLHIV")
          formats = {
              ".ttl": "turtle",
              ".rdf": "xml",
              ".owl": "xml",
              ".jsonld": "json-ld",
          }

          files = [
              p for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in formats
          ]

          if not files:
              raise SystemExit(
                  "ERREUR : aucun fichier RDF/OWL trouve dans PLHIV/"
              )

          errors = []

          for path in files:
              try:
                  graph = Graph()
                  graph.parse(
                      str(path),
                      format=formats[path.suffix.lower()]
                  )
                  print(f"OK : {path} ({len(graph)} triplets)")
              except Exception as exc:
                  errors.append(path)
                  print(f"ERREUR : {path} : {exc}")

          if errors:
              raise SystemExit(
                  f"Validation echouee : {len(errors)} fichier(s) invalide(s)"
              )

          print(f"Validation terminee : {len(files)} fichier(s) valide(s)")
          PY

  deploy:
    name: Deployer sur le VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configurer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "ERREUR : secret SSH absent ou vide."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "Configuration SSH terminee."

      - name: Verifier la connexion SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "ERREUR : VPS_HOST ou VPS_USER absent."
            exit 1
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "Connexion SSH OK"'

      - name: Verifier le repertoire distant
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -d /var/www/ontologies &&
             test -w /var/www/ontologies &&
             echo "Repertoire distant accessible en ecriture"'

      - name: Deployer les ontologies PLHIV
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "=== Verification du dossier local ==="

          if [ ! -d PLHIV ]; then
            echo "ERREUR : le dossier PLHIV/ est absent du depot local."
            exit 1
          fi

          find PLHIV -type f -print

          echo "=== Deploiement vers le VPS ==="

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            PLHIV/ \
            "$VPS_USER@$VPS_HOST:/var/www/ontologies/"

          echo "Deploiement termine."

      - name: Verifier les fichiers deployes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'find /var/www/ontologies -type f -print'

          echo "Verification finale terminee."